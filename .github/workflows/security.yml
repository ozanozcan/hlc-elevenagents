# security-kit managed copy — do not hand-edit; edits fail the drift gate. Core: templates/security · Front: docs/workflow/fronts/hlc-elevenagents/security.json
# Secret, code and dependency scans with no account and no token (req #185). A finding fails its
# job unless the committed ignore file each job names lists it with a reason (req #186).
# Re-render with `security-kit render <repo>`.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC: new advisories against unchanged code
  workflow_call:
    inputs:
      ref:
        description: Commit to scan; empty scans the triggering commit
        type: string
        default: ""

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned version, verified by the Go checksum database)
        run: go install github.com/zricethezav/gitleaks/v8@v8.21.2
      - name: gitleaks over the full history of every ref (exclusions in .gitleaksignore)
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact --verbose --log-opts=--all .

  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Semgrep CE (no login, no token, no metrics; exclusions in .semgrepignore)
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3 \
            semgrep scan --config p/python --config p/typescript --config p/react --config p/owasp-top-ten --config p/security-audit --error --metrics=off
